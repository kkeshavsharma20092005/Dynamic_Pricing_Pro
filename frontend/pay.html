<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <title>Raahi - Pay for your ride</title>
  <link rel="icon" href="/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/app.css?v=21" />
</head>
<body class="pay-page">
  <header class="topbar"><h1><a href="/">Raahi</a></h1></header>
  <main class="pay-main">
    <section class="confirm-card pay-sheet" aria-live="polite">
      <div class="demo-ribbon">DEMO PAYMENT · NO REAL MONEY IS CHARGED</div>
      <div id="pay-body" class="stack"><div class="skeleton"></div><div class="skeleton short"></div></div>
    </section>
  </main>
  <script>
    // Opened by scanning the QR code at the end of a Raahi trip. Text from the server goes
    // through textContent only, never innerHTML.
    const token = location.pathname.split("/").filter(Boolean)[1];
    const body = document.getElementById("pay-body");
    const rupees = n => "₹" + Math.round(n).toLocaleString("en-IN");

    function node(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    function trip(d) {
      const box = node("dl", "confirm-facts");
      [["Amount", rupees(d.fare)], ["Ride", "#" + d.ride_id], ["Vehicle", d.vehicle]].forEach(([k, v]) => {
        const cell = node("div");
        cell.append(node("dt", "", k), node("dd", "", v));
        box.append(cell);
      });
      return box;
    }

    function route(d) {
      const list = node("ol", "confirm-trip");
      const from = node("li", "from"); from.append(node("span", "muted", "Pickup"), node("strong", "", d.pickup));
      const to = node("li", "to"); to.append(node("span", "muted", "Drop-off"), node("strong", "", d.dropoff));
      list.append(from, to);
      return list;
    }

    function show(...children) { body.replaceChildren(...children); }

    function paid(d) {
      const when = d.paid_at ? new Date(d.paid_at * 1000).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "";
      const head = node("div", "confirm-head");
      head.append(node("div", "confirm-check pay-done", "✓"), node("h2", "", "Payment received"),
        node("p", "", `${rupees(d.fare)} paid${d.driver ? " for your ride with " + d.driver : ""}${d.method === "cash" ? " in cash" : ""}.`));
      show(head, trip(d), route(d), node("p", "muted confirm-note", when ? `Paid on ${when}. ` : ""),
        node("p", "confirm-note", "You can close this page. Your Raahi app has moved on to the next step."));
    }

    function failed(message) {
      const head = node("div", "confirm-head");
      head.append(node("div", "confirm-check pay-fail", "!"), node("h2", "", "Payment not done"), node("p", "", message));
      show(head);
    }

    async function call(method) {
      const response = await fetch("/api/pay/" + encodeURIComponent(token), { method });
      const data = await response.json().catch(() => null);
      if (!response.ok) throw new Error((data && data.detail) || "Something went wrong. Please try again.");
      return data;
    }

    (async () => {
      try {
        const d = await call("GET");
        if (d.paid) return paid(d);
        const head = node("div", "confirm-head");
        head.append(node("div", "pay-spinner"), node("h2", "", `Paying ${rupees(d.fare)}…`),
          node("p", "", "Confirming your demo payment with Raahi"));
        show(head, trip(d), route(d));
        // A short pause, so the step is visible, then the payment is confirmed.
        await new Promise(resolve => setTimeout(resolve, 1500));
        paid(await call("POST"));
        if (navigator.vibrate) navigator.vibrate(150);
      } catch (e) { failed(e.message); }
    })();
  </script>
</body>
</html>
