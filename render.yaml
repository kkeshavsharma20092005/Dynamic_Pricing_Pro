# Render Blueprint. With this file in the repo root, Render configures the service
# automatically — no clicking through the dashboard, and the config is version-controlled.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance -> pick this repo.
services:
  - type: web
    name: dynamic-pricing-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore

    # Render polls this after every deploy. It is cheap and never touches the model, so
    # it answers in ~1 ms. Pointing a health check at /predict/ would run inference on
    # every poll and waste the free tier's compute.
    healthCheckPath: /health/

    autoDeploy: true

    envVars:
      # Without a fixed secret, every restart would log everyone out.
      - key: APP_SECRET
        generateValue: true
      # Set this in the Render dashboard. Never commit it.
      - key: ADMIN_PASSWORD
        sync: false
