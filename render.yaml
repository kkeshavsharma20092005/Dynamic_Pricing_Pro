# Render Blueprint. With this file in the repo root, Render configures the service
# automatically — no clicking through the dashboard, and the config is version-controlled.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance -> pick this repo.
services:
  - type: web
    name: dynamic-pricing-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore

    # Render polls this after every deploy. It is cheap and never touches the model, so
    # it answers in ~1 ms. Pointing a health check at /predict/ would run inference on
    # every poll and waste the free tier's compute.
    healthCheckPath: /health/

    autoDeploy: true

    envVars:
      # Without a fixed secret, every restart would log everyone out.
      - key: APP_SECRET
        generateValue: true
      # Set this in the Render dashboard. Never commit it.
      - key: ADMIN_PASSWORD
        sync: false
      # REQUIRED on the free plan: its disk is wiped whenever the service sleeps, so
      # accounts must live in a hosted PostgreSQL database (e.g. a free Neon project).
      # Without it the app falls back to SQLite and loses every account on restart.
      - key: DATABASE_URL
        sync: false
      # Email for "Forgot password?" codes. For Gmail: smtp.gmail.com, port 587, your
      # address as SMTP_USER and an App Password (not your normal password) as SMTP_PASSWORD.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
